name: lenny_workspace
publish_to: none
environment:
  sdk: ^3.11.0
workspace:
  - packages/leonard_contract
  - packages/leonard_host
  - packages/leonard_flutter
  - packages/leonard_flutter_test
  - packages/leonard_flutter/example/diagnostic_fixture
  - packages/leonard_flutter/example/sample_app
  - packages/leonard_agent
  - packages/leonard_cli
  - packages/leonard_devtools
  - packages/leonard_router
  - packages/leonard_riverpod
  - packages/leonard_dio
  - packages/leonard_tmux
  - packages/leonard_native

dev_dependencies:
  coverage: ^1.15.1
  melos: ^7.7.0

melos:
  scripts:
    # ---------- primary scripts ----------
    test:
      description: >-
        Run all unit/widget tests (excludes perf tests in leonard_devtools
        and excludes the env-gated dogfood e2e). Runs dart test on pure-Dart
        packages and flutter test on Flutter packages.

        Invoked through `dart run melos`, so this works from the workspace's
        own melos dev_dependency. A `steps:` list would shell out to a BARE
        `melos`, which only resolves when melos is also globally activated --
        otherwise the script dies with "melos: command not found".
      run: >-
        dart run melos exec --no-flutter --ignore=leonard_flutter_test -- dart test &&
        dart run melos exec --flutter -- flutter test &&
        dart run melos exec --scope=leonard_flutter_test -- flutter test

    analyze:
      description: >-
        Run dart analyze on the entire workspace.
      run: dart analyze

    format:
      description: >-
        Check formatting for all Dart files. Fails if any file needs changes.
      run: dart format --output=none --set-exit-if-changed .

    test:e2e:
      description: >-
        Run the live dogfood e2e test against swift-infer.
        Requires SWIFT_INFER_ENDPOINT and SWIFT_INFER_AGENT_TOKEN to be set.
        The test self-skips when those vars are absent, so this script is safe
        to invoke locally - it will simply report all tests skipped.
      run: >-
        dart test packages/leonard_agent/integration_test/dogfood/dogfood_e2e_test.dart

    test:integration:
      description: >-
        Run all environment-gated integration suites explicitly. Individual
        suites self-skip when their required services or credentials are absent.
      run: >-
        dart test packages/leonard_agent/integration_test
        packages/leonard_cli/integration_test
        packages/leonard_native/integration_test

    test:e2e:auth0:
      description: >-
        Run the live Auth0 round-trip dogfood e2e (leonard_native m5). Requires a
        booted iOS sim + Appium + LEONARD_NATIVE_* and AUTH0_EMAIL/AUTH0_PASSWORD.
        Self-skips when absent, so it is safe to invoke locally.
      run: >-
        dart test packages/leonard_cli/integration_test/dogfood/dogfood_auth0_e2e_test.dart

    test:e2e:auth0:android:
      description: >-
        Run the live ANDROID Auth0 round-trip dogfood e2e (leonard_native
        UiAutomator2Backend). Requires a booted Android emulator + Appium with
        the UiAutomator2 driver + LEONARD_NATIVE_ANDROID_* and
        AUTH0_EMAIL/AUTH0_PASSWORD. Self-skips when absent, so it is safe to
        invoke locally.
      run: >-
        dart test packages/leonard_cli/integration_test/dogfood/dogfood_auth0_android_e2e_test.dart

    # The `test` script above inlines both tiers directly. The former
    # `test:dart` / `test:flutter` private sub-scripts existed only to be
    # named in a `steps:` list; nothing else referenced them, and that
    # indirection was the sole reason a bare `melos` had to be on PATH.
    #
    # Their `ignore: ["**/example/**"]` filter was a no-op -- melos matches
    # that glob against the package NAME (`sample_app`,
    # `diagnostic_fixture`), not its path, so the examples were always part
    # of the flutter tier. Inlining preserves that: the example packages
    # still run, exactly as before.
