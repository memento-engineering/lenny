name: leonard_grid_assets
description: >-
  Lenny's grid assets: the station-driven selfdrive and Leonard E2E circuits,
  deterministic E2E Command, and shared capability registry.
version: 0.1.0-rc.2
repository: https://github.com/memento-engineering/lenny

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  beads_dart: ^0.2.0-rc.5
  genesis_tree: ^0.3.0
  grid_assets: ^0.6.0-rc.7
  grid_engine: ^0.3.0-rc.21
  grid_runtime: ^0.2.0-rc.15
  grid_sdk: ^0.3.0-rc.18
  http: ^1.2.0
  leonard_agent: ^0.3.1
  leonard_cli: ^0.3.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
  yaml: ^3.1.2

grid:
  assets:
    - id: test-with-leonard
      kind: skill
      description: "Route Dart and Flutter test authoring to the cheapest proving level and load only the selected Leonard reference."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/SKILL.md

    - id: plain-dart-flutter
      kind: resource
      description: "Level 0 reference for tests that prove behavior without Leonard live driving."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/plain-dart-flutter.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/plain-dart-flutter.md

    - id: widget
      kind: resource
      description: "Level 1 reference for testing Leonard extensions and observations without a device."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/widget.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/widget.md

    - id: scripted-device
      kind: resource
      description: "Level 2 reference for scripted tests against a simulator or emulator."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/scripted-device.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/scripted-device.md

    - id: hardware
      kind: resource
      description: "Level 3 reference for tests whose behavior exists only on physical hardware."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/hardware.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/hardware.md

    - id: oracle
      kind: resource
      description: "Level 4 reference for scenarios graded by an independent oracle."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/oracle.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/oracle.md

    - id: mutation
      kind: resource
      description: "Reference for improving assertion quality through mutation testing."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/mutation.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/mutation.md

    - id: triage
      kind: resource
      description: "Reference for diagnosing a failed Leonard test run."
      audience: agent
      visibility: public
      selector: any
      artifacts:
        - target: claude
          path: extension/station_overlay/claude/skills/test-with-leonard/references/triage.md
        - target: mcp
          path: extension/station_overlay/claude/skills/test-with-leonard/references/triage.md

  station_overlay:
    mappings:
      claude: .claude
