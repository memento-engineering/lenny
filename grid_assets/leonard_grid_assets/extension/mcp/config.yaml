# Lenny's grid assets in the packaged-assets manifest shape. The Dart registry
# is the active runtime path; this file is its declarative mirror.
name: leonard_grid_assets
version: 1

resources: []

circuits:
  - id: selfdrive
    terminal_step: verify
    supervision: rest_for_one
    steps:
      - id: preflight
        capability: preflight
        kind: job
        depends_on: []
      - id: panel-harness
        capability: panel-harness
        kind: daemon
        depends_on: [preflight]
      - id: outer-driver
        capability: outer-driver
        kind: job
        depends_on: [panel-harness]
      - id: verify
        capability: verify
        kind: job
        depends_on: [outer-driver]
  - id: leonard-e2e
    terminal_step: inspect
    supervision: rest_for_one
    steps:
      - id: preflight
        capability: e2e-preflight
        kind: job
        depends_on: []
      - id: launch
        capability: e2e-launch
        kind: daemon
        depends_on: [preflight]
      - id: run
        capability: e2e-run
        kind: job
        depends_on: [launch]
      - id: inspect
        capability: e2e-inspect
        kind: job
        depends_on: [run]
