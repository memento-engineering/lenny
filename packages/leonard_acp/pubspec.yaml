name: leonard_acp
description: >-
  ACP (Agent Client Protocol) model provider for Leonard — drives any
  ACP-compatible coding agent as a per-turn decision oracle behind
  leonard_agent's ModelProvider seam.
version: 0.1.0
repository: https://github.com/memento-engineering/lenny
publish_to: none
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  # acp_dart, NOT dart_acp. dart_acp 0.1.1 pins mcp_dart ^1.0.2, which cannot
  # co-resolve with leonard_agent's dartantic_ai ^3.4.1 (needs mcp_dart ^2.2.2)
  # in a shared pub workspace. acp_dart depends only on collection/path/
  # json_annotation, and carries the full client surface we need: initialize,
  # newSession, prompt, cancel, plus the Client callback interface.
  acp_dart: ^0.4.0
  args: ^2.6.0
  leonard_agent: ^0.2.0
  meta: ^1.16.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
