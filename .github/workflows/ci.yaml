name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: dart pub global activate melos
      - run: ./tool/build_devtools_extension.sh
      - run: dart analyze
      - run: ./tool/check_no_dart_io.sh
      - name: Collect test coverage
        run: ./tool/collect_coverage.sh
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage/*.lcov
          if-no-files-found: error
          retention-days: 14
  # Stable required-check name for branch protection. Pin protection to
  # `ci-required` so renaming the jobs above never silently un-gates merges.
  ci-required:
    if: always()
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.analyze-and-test.result }}" != "success" ]; then
            echo "analyze-and-test did not succeed: ${{ needs.analyze-and-test.result }}"
            exit 1
          fi
