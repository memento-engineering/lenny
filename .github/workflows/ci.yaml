name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - run: dart pub global activate melos
      - run: ./tool/build_devtools_extension.sh
      - run: dart analyze
      - run: ./tool/check_no_dart_io.sh
      - run: melos run test --no-select
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: dart pub global activate melos
      - name: Collect test coverage
        run: ./tool/collect_coverage.sh
      - name: Validate lcov reports
        run: |
          expected="$(( $(dart run melos list --parsable | wc -l | tr -d ' ') + 1 ))"
          actual="$(find artifacts/coverage -maxdepth 1 -name '*.lcov' | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
          for report in artifacts/coverage/*.lcov; do
            test -s "$report"
            lcov --quiet --list "$report" >/dev/null
            ! grep '^SF:' "$report" | grep -qv '^SF:packages/'
          done
          grep -q '^SF:packages/' artifacts/coverage/workspace.lcov
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage/*.lcov
          if-no-files-found: error
          retention-days: 14
  mutation-nightly:
    if: github.event_name == 'schedule'
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `prove_uncovered` asserts the lcov input actually narrowed the
          # mutant set. It only holds for a package that still has uncovered
          # lines; leonard_contract is near-fully covered, so a nonzero
          # "Not covered by tests" count would be a false gate there.
          - package: leonard_native
            prove_uncovered: 'true'
          - package: leonard_contract
            prove_uncovered: 'false'
          # leonard_flutter is deliberately ABSENT from the nightly full
          # sweep. Its suite costs ~11s per run under `flutter test` against
          # 777 mutants — roughly 2.4 hours, every night. It is covered by
          # the changed-file pr lane below until that is worth paying for.
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - name: Download coverage input
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage
      - name: Run full mutation sweep
        run: ./tool/run_mutation_pilot.sh full ${{ matrix.package }}
      - name: Prove coverage input was applied
        if: matrix.prove_uncovered == 'true'
        run: >-
          grep -Eq 'Not covered by tests: [1-9][0-9]*'
          artifacts/mutation/${{ matrix.package }}/full/console.txt
      - name: Upload full mutation report
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}-full
          path: artifacts/mutation/${{ matrix.package }}/full/
          if-no-files-found: error
          retention-days: 14
  mutation-pr:
    if: github.event_name == 'pull_request'
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # `max_files` bounds the sweep by how expensive one mutant is.
          # A pure-Dart suite runs in well under a second; leonard_flutter's
          # costs ~11s under `flutter test`, so the same cap would blow the
          # job timeout — and a timeout is a red job, which is exactly the
          # noise gating-off is meant to remove.
          - package: leonard_native
            max_files: '5'
          - package: leonard_contract
            max_files: '5'
          - package: leonard_flutter
            max_files: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - name: Download coverage input
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage
      - name: Select changed production Dart files
        id: changed
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          MAX_FILES: ${{ matrix.max_files }}
        run: |
          mkdir -p "artifacts/mutation/$PKG/pr"
          # THREE-dot. A two-dot `base head` diff also reports files that
          # main gained after this branch was cut -- the PR looks like it
          # reverted them -- so unrelated packages get mutation-tested and
          # someone else's score fails this job. Three-dot diffs against the
          # merge-base, which is what "changed by this PR" means.
          mapfile -t eligible < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" |
              grep -E "^packages/$PKG/.*\.dart$" |
              grep -Ev "^packages/$PKG/(test|integration_test)/" |
              sed "s#^packages/$PKG/##" |
              sort -u
          )
          selected=("${eligible[@]:0:$MAX_FILES}")
          printf '%s\n' "${selected[@]}" | sed '/^$/d' > "$RUNNER_TEMP/mutation-files.txt"
          count="$(wc -l < "$RUNNER_TEMP/mutation-files.txt" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if (( count == 0 )); then
            echo "No eligible changed $PKG Dart files." |
              tee "artifacts/mutation/$PKG/pr/console.txt"
          elif (( ${#eligible[@]} > MAX_FILES )); then
            # Never truncate silently — a capped sweep that reads as full
            # coverage is worse than no sweep.
            echo "Selected $MAX_FILES of ${#eligible[@]} eligible files; the rest were NOT swept." |
              tee "artifacts/mutation/$PKG/pr/selection.txt"
          fi
      - name: Run changed-file mutation sweep
        if: steps.changed.outputs.count != '0'
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: |
          mapfile -t mutation_files < "$RUNNER_TEMP/mutation-files.txt"
          ./tool/run_mutation_pilot.sh pr "$PKG" "${mutation_files[@]}"
      - name: Prove coverage input was applied
        if: steps.changed.outputs.count != '0'
        run: >-
          grep -Eq 'Not covered by tests: [0-9]+'
          artifacts/mutation/${{ matrix.package }}/pr/console.txt
      - name: Upload changed-file mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}-pr-${{ github.event.pull_request.number }}
          path: artifacts/mutation/${{ matrix.package }}/pr/
          if-no-files-found: error
          retention-days: 14
  # Stable required-check name for branch protection. Pin protection to
  # `ci-required` so renaming the jobs above never silently un-gates merges.
  ci-required:
    if: always()
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.analyze-and-test.result }}" != "success" ]; then
            echo "analyze-and-test did not succeed: ${{ needs.analyze-and-test.result }}"
            exit 1
          fi
