name: ci
on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run melos run format --no-select
      - run: dart pub global activate melos
      - run: ./tool/build_devtools_extension.sh
      - run: dart analyze
      - run: ./tool/check_no_dart_io.sh
      - run: melos run test --no-select
  grid-assets:
    # `grid_assets/leonard_grid_assets` is a PUBLISHED package that is neither
    # a workspace member nor covered by the root `dart analyze` (the root
    # analysis_options excludes `grid_assets/**`). It resolves from pub, so it
    # gates on its own here — without this job a red pack publishes green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grid_assets/leonard_grid_assets
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: dart pub global activate melos
      - name: Collect test coverage
        run: ./tool/collect_coverage.sh
      - name: Validate lcov reports
        run: |
          expected="$(( $(dart run melos list --parsable | wc -l | tr -d ' ') + 1 ))"
          actual="$(find artifacts/coverage -maxdepth 1 -name '*.lcov' | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
          for report in artifacts/coverage/*.lcov; do
            test -s "$report"
            lcov --quiet --list "$report" >/dev/null
            ! grep '^SF:' "$report" | grep -qv '^SF:packages/'
          done
          grep -q '^SF:packages/' artifacts/coverage/workspace.lcov
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage/*.lcov
          if-no-files-found: error
          retention-days: 14
  mutation-nightly-plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [coverage]
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select files and build shard matrix
        id: plan
        shell: bash
        run: |
          flutter_base_sha="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true
          )"
          if [[ -z "$flutter_base_sha" ]]; then
            flutter_base_sha=HEAD~20
          fi
          rotation_seed="$(date -u +%Y%m%d)"

          for package in leonard_native leonard_contract leonard_flutter; do
            selection_dir="artifacts/mutation-selection/$package"
            mkdir -p "$selection_dir"
            if [[ "$package" == leonard_flutter ]]; then
              MAX_FILES=4
              BASE_SHA="$flutter_base_sha"
              HEAD_SHA=HEAD
              rotate_count=3
            else
              # A zero diff cap plus a rotation as large as the tracked lib
              # set asks the one selector for every pure-Dart production file.
              MAX_FILES=0
              BASE_SHA=HEAD
              HEAD_SHA=HEAD
              rotate_count="$(
                git ls-tree -r --name-only HEAD -- "packages/$package/lib" |
                  awk '/\.dart$/ {count++} END {print count + 0}'
              )"
            fi
            ./tool/select_mutation_files.sh \
              "$package" "$MAX_FILES" "$BASE_SHA" "$HEAD_SHA" \
              --out-dir "$selection_dir" \
              --rotate "$rotate_count" "$rotation_seed" \
              > "$selection_dir/files.txt"
          done

          matrix="$(jq -cn '
            {
              include:
                ([range(0; 3) | {package: "leonard_native", shard_index: ., shard_count: 3}] +
                 [range(0; 1) | {package: "leonard_contract", shard_index: ., shard_count: 1}] +
                 [range(0; 6) | {package: "leonard_flutter", shard_index: ., shard_count: 6}])
            }
          ')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Upload mutation selections
        uses: actions/upload-artifact@v4
        with:
          name: mutation-selections
          path: artifacts/mutation-selection/
          if-no-files-found: error
          retention-days: 1

  mutation-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [coverage, mutation-nightly-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.mutation-nightly-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - name: Download coverage input
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage
      - name: Download mutation selections
        uses: actions/download-artifact@v4
        with:
          name: mutation-selections
          path: artifacts/mutation-selection
      - name: Run assigned file shard
        id: shard
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          SHARD_COUNT: ${{ matrix.shard_count }}
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          selection_file="artifacts/mutation-selection/$PKG/files.txt"
          test -f "$selection_file"
          assigned="$RUNNER_TEMP/mutation-files.txt"
          awk -v shard_count="$SHARD_COUNT" -v shard_index="$SHARD_INDEX" '(NR-1) % shard_count == shard_index' "$selection_file" > "$assigned"
          count="$(wc -l < "$assigned" | tr -d ' ')"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          mapfile -t shard_files < "$assigned"
          if (( count > 0 )); then
            if [[ "$PKG" == leonard_flutter ]]; then
              ./tool/run_mutation_pilot.sh dry "$PKG" "${shard_files[@]}"
            fi
            ./tool/run_mutation_pilot.sh full "$PKG" "${shard_files[@]}"
          else
            artifact_dir="artifacts/mutation/$PKG/full"
            mkdir -p "$artifact_dir"
            printf 'No files assigned to shard %s of %s.\n' \
              "$SHARD_INDEX" "$SHARD_COUNT" > "$artifact_dir/console.txt"
            printf '%s\n' \
              'Found 0 mutations in 0 source files!' \
              'Total tests: 0' \
              'Undetected Mutations: 0 (0.00%)' \
              'Not covered by tests: 0' >> "$artifact_dir/console.txt"
            printf '# Mutation report\n\nNo files were assigned to this shard.\n' \
              > "$artifact_dir/mutation-test-report.md"
          fi
      - name: Preserve mutation selection
        if: always()
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          SHARD_COUNT: ${{ matrix.shard_count }}
          SHARD_INDEX: ${{ matrix.shard_index }}
        run: |
          artifact_dir="artifacts/mutation/$PKG/full"
          mkdir -p "$artifact_dir"
          selection_dir="artifacts/mutation-selection/$PKG"
          if [[ -f "$selection_dir/selection.txt" ]]; then
            cp -f \
              "$selection_dir/selection.txt" \
              "$artifact_dir/selection.txt"
          fi
          if [[ -f "$RUNNER_TEMP/mutation-files.txt" ]]; then
            cp -f "$RUNNER_TEMP/mutation-files.txt" "$artifact_dir/files.txt"
          else
            : > "$artifact_dir/files.txt"
          fi
          if [[ "${{ steps.shard.outputs.count }}" == 0 ]]; then
            printf 'No files assigned to shard %s of %s.\n' \
              "$SHARD_INDEX" "$SHARD_COUNT" > "$artifact_dir/console.txt"
            printf '%s\n' \
              'Found 0 mutations in 0 source files!' \
              'Total tests: 0' \
              'Undetected Mutations: 0 (0.00%)' \
              'Not covered by tests: 0' >> "$artifact_dir/console.txt"
            if [[ ! -f "$artifact_dir/mutation-test-report.md" ]]; then
              printf '# Mutation report\n\nNo files were assigned to this shard.\n' \
                > "$artifact_dir/mutation-test-report.md"
            fi
          fi
      - name: Upload mutation shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}-full-shard-${{ matrix.shard_index }}
          path: artifacts/mutation/${{ matrix.package }}/full/
          if-no-files-found: error
          retention-days: 1

  mutation-nightly-aggregate:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [mutation-nightly]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: leonard_native
            shard_count: 3
          - package: leonard_contract
            shard_count: 1
          - package: leonard_flutter
            shard_count: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download mutation shards
        uses: actions/download-artifact@v4
        with:
          pattern: mutation-${{ matrix.package }}-full-shard-*
          path: artifacts/mutation-shards
          merge-multiple: false
      - name: Aggregate mutation shards
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          SHARD_COUNT: ${{ matrix.shard_count }}
        run: |
          mkdir -p "artifacts/mutation/$PKG"
          ./tool/aggregate_mutation_shards.sh \
            "$PKG" "$SHARD_COUNT" \
            artifacts/mutation-shards \
            "artifacts/mutation/$PKG/full"
      - name: Prove coverage input was applied
        shell: bash
        env:
          PKG: ${{ matrix.package }}
        run: |
          output="artifacts/mutation/$PKG/full"
          if [[ "$PKG" == leonard_native || \
                ( "$PKG" == leonard_flutter && -s "$output/files.txt" ) ]]; then
            grep -Eq 'Not covered by tests: [0-9]+' "$output/console.txt"
          fi
      - name: Upload canonical mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}-full
          path: artifacts/mutation/${{ matrix.package }}/full/
          if-no-files-found: error
          retention-days: 14
  # Stable required-check name for branch protection. Pin protection to
  # `ci-required` so renaming the jobs above never silently un-gates merges.
  ci-required:
    if: always()
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.analyze-and-test.result }}" != "success" ]; then
            echo "analyze-and-test did not succeed: ${{ needs.analyze-and-test.result }}"
            exit 1
          fi
