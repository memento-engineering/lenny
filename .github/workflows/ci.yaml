name: ci
on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run melos run format --no-select
      - run: dart pub global activate melos
      - run: ./tool/build_devtools_extension.sh
      - run: dart analyze
      - run: ./tool/check_no_dart_io.sh
      - run: melos run test --no-select
  grid-assets:
    # `grid_assets/leonard_grid_assets` is a PUBLISHED package that is neither
    # a workspace member nor covered by the root `dart analyze` (the root
    # analysis_options excludes `grid_assets/**`). It resolves from pub, so it
    # gates on its own here — without this job a red pack publishes green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grid_assets/leonard_grid_assets
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart analyze
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - run: flutter pub get
      - run: dart pub global activate melos
      - name: Collect test coverage
        run: ./tool/collect_coverage.sh
      - name: Validate lcov reports
        run: |
          expected="$(( $(dart run melos list --parsable | wc -l | tr -d ' ') + 1 ))"
          actual="$(find artifacts/coverage -maxdepth 1 -name '*.lcov' | wc -l | tr -d ' ')"
          test "$actual" = "$expected"
          for report in artifacts/coverage/*.lcov; do
            test -s "$report"
            lcov --quiet --list "$report" >/dev/null
            ! grep '^SF:' "$report" | grep -qv '^SF:packages/'
          done
          grep -q '^SF:packages/' artifacts/coverage/workspace.lcov
      - name: Upload lcov reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage/*.lcov
          if-no-files-found: error
          retention-days: 14
  mutation-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full modes sweep every production file. `max_files` caps only
          # the diff portion of a selected mode before rotation is appended.
          # `prove_uncovered` asserts the lcov coverage classification is
          # present whether the reported count is zero or nonzero. One
          # pure-Dart package proves the shared runner path without
          # duplicating this signal in every matrix job.
          - package: leonard_native
            mode: full
            prove_uncovered: 'true'
          - package: leonard_contract
            mode: full
            prove_uncovered: 'false'
          - package: leonard_flutter
            mode: pr
            max_files: '4'
            prove_uncovered: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
      - run: flutter pub get
      - name: Download coverage input
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: artifacts/coverage
      - name: Select mutation files
        id: changed
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          MODE: ${{ matrix.mode }}
          MATRIX_MAX_FILES: ${{ matrix.max_files }}
        run: |
          BASE_SHA="$(
            gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?event=schedule&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true
          )"
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=HEAD~20
          fi
          HEAD_SHA=HEAD

          if [[ "$MODE" == full ]]; then
            MAX_FILES="$(
              git ls-tree -r --name-only "$HEAD_SHA" -- "packages/$PKG" |
                wc -l |
                tr -d ' '
            )"
          else
            MAX_FILES="$MATRIX_MAX_FILES"
          fi

          selection_dir="$RUNNER_TEMP/mutation-selection"
          ./tool/select_mutation_files.sh \
            "$PKG" "$MAX_FILES" "$BASE_SHA" "$HEAD_SHA" \
            --out-dir "$selection_dir" \
            --rotate 3 "$(date -u +%Y%m%d)" \
            >"$RUNNER_TEMP/mutation-files.txt"
          count="$(wc -l <"$RUNNER_TEMP/mutation-files.txt" | tr -d ' ')"
          echo "count=$count" >>"$GITHUB_OUTPUT"
      - name: Run mutation sweep
        if: matrix.mode == 'full' || steps.changed.outputs.count != '0'
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          MODE: ${{ matrix.mode }}
        run: |
          if [[ "$MODE" == full ]]; then
            ./tool/run_mutation_pilot.sh full "$PKG"
          else
            mapfile -t mutation_files <"$RUNNER_TEMP/mutation-files.txt"
            ./tool/run_mutation_pilot.sh pr "$PKG" "${mutation_files[@]}"
          fi
      - name: Preserve mutation selection
        if: always()
        shell: bash
        env:
          PKG: ${{ matrix.package }}
          MODE: ${{ matrix.mode }}
        run: |
          artifact_dir="artifacts/mutation/$PKG/$MODE"
          mkdir -p "$artifact_dir"
          if [[ -f "$RUNNER_TEMP/mutation-selection/selection.txt" ]]; then
            cp -f \
              "$RUNNER_TEMP/mutation-selection/selection.txt" \
              "$artifact_dir/selection.txt"
          fi
          if [[ "${{ steps.changed.outputs.count }}" == 0 && \
                -f "$RUNNER_TEMP/mutation-selection/console.txt" ]]; then
            cp -f \
              "$RUNNER_TEMP/mutation-selection/console.txt" \
              "$artifact_dir/console.txt"
          fi
      - name: Prove coverage input was applied
        if: matrix.prove_uncovered == 'true' || (matrix.package == 'leonard_flutter' && steps.changed.outputs.count != '0')
        run: >-
          grep -Eq 'Not covered by tests: [0-9]+'
          artifacts/mutation/${{ matrix.package }}/${{ matrix.mode }}/console.txt
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}-${{ matrix.mode }}
          path: artifacts/mutation/${{ matrix.package }}/${{ matrix.mode }}/
          if-no-files-found: error
          retention-days: 14
  # Stable required-check name for branch protection. Pin protection to
  # `ci-required` so renaming the jobs above never silently un-gates merges.
  ci-required:
    if: always()
    needs: [analyze-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.analyze-and-test.result }}" != "success" ]; then
            echo "analyze-and-test did not succeed: ${{ needs.analyze-and-test.result }}"
            exit 1
          fi
