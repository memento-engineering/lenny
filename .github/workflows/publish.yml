name: Publish to pub.dev

# Per-package release tags: `<package>-v<version>` (power_station ADR-0003 D1
# naming, pointed at pub.dev). Pushing e.g. `leonard_flutter-v0.1.8` publishes
# packages/leonard_flutter via pub.dev's GitHub-Actions trusted publishing
# (OIDC — no long-lived credential in CI). This replaces the repo-level
# `v0.1.x` tag anti-pattern; old repo-level tags stay put but publish nothing.
#
# Each package needs automated publishing enabled once on its pub.dev admin
# page (repository memento-engineering/lenny, tag pattern
# `<package>-v{{version}}`). pub.dev requires that FIRST version to be
# published by hand — the tag path only works once the toggle exists — so a
# package's initial version carries no tag by design.
#
# Most members live under `packages/`; `leonard_grid_assets` is a standalone
# station pack under `grid_assets/` and is NOT a workspace member, so the
# publish directory is looked up, never assumed.
#
# Push ONE tag per `git push` — GitHub fires no workflows for a push
# containing more than three tags, and dependency ordering needs per-tag
# pushes anyway.

on:
  push:
    tags:
      - 'leonard_*-v[0-9]+.[0-9]+.[0-9]+'
      - 'leonard_*-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      directory: ${{ steps.parse.outputs.directory }}
    steps:
      - id: parse
        run: |
          pkg="${GITHUB_REF_NAME%-v*}"
          case "$pkg" in
            leonard_grid_assets) dir="grid_assets/$pkg" ;;
            *) dir="packages/$pkg" ;;
          esac
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "directory=$dir" >> "$GITHUB_OUTPUT"
          echo "Publishing package: $pkg from $dir (tag $GITHUB_REF_NAME)"

  publish:
    needs: parse
    permissions:
      id-token: write # pub.dev OIDC trusted publishing
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: ${{ needs.parse.outputs.directory }}
